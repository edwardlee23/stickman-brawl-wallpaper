name: Dependabot auto-merge

# Minor and patch updates merge themselves (squash) once main's required check
# passes; majors wait for a person.
on: pull_request

# No token scopes for the workflow as a whole; the job below asks for what it needs.
permissions: {}

jobs:
  auto-merge:
    # Who opened the PR, not github.actor (who triggered this run).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Only minor and patch updates merge themselves. An update fetch-metadata cannot
      # classify leaves update-type empty, so it waits for a person like a major does.
      - if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
